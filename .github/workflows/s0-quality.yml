name: S0 Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: s0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit the complete dependency graph
        run: pnpm audit --audit-level high

      - name: Run the complete quality gate
        run: pnpm check

      - name: Verify the Supabase baseline with pgTAP
        id: supabase_db
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase start \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1
          pnpm test:database

      - name: Show Supabase database diagnostics
        if: failure() && steps.supabase_db.outcome == 'failure'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/supabase-start.log" ]]; then
            node scripts/redact-supabase-log.mjs "$RUNNER_TEMP/supabase-start.log"
          fi
          docker ps -a --filter 'name=supabase_' --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker logs --tail 200 supabase_db_loya 2>&1 || true

      - name: Stop the Supabase database
        if: always() && steps.supabase_db.outcome != 'skipped'
        run: pnpm exec supabase stop --project-id loya --no-backup || true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser flows in Chromium
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke-test Static Assets and API routing
        shell: bash
        run: |
          pnpm --filter @loya/worker dev > "$RUNNER_TEMP/loya-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/loya-worker.log"
            exit 1
          fi

          node scripts/smoke-worker.mjs http://127.0.0.1:8787
