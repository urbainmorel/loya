name: S0 Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: s0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit the complete dependency graph
        run: pnpm audit --audit-level high

      - name: Run the complete quality gate
        run: pnpm check

      - name: Verify Supabase baseline and OQ-002 read path
        id: supabase_db
        shell: bash
        run: |
          set -euo pipefail
          key_file=""
          pgtap_log=""
          worker_env=""
          worker_pid=""

          cleanup() {
            if [[ -n "$worker_pid" ]]; then
              kill -- "-$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            if [[ -n "$key_file" && -f "$key_file" ]]; then
              rm -f -- "$key_file"
            fi
            if [[ -n "$pgtap_log" && -f "$pgtap_log" ]]; then
              rm -f -- "$pgtap_log"
            fi
            if [[ -n "$worker_env" && -f "$worker_env" ]]; then
              rm -f -- "$worker_env"
            fi
          }
          trap cleanup EXIT INT TERM

          pnpm exec supabase start \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            --ignore-health-check \
            --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1
          pnpm test:database

          auth_ready=0
          for attempt in {1..60}; do
            auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:54321/auth/v1/health || true)"
            if [[ "$auth_status" == "200" ]]; then
              auth_ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$auth_ready" -ne 1 ]]; then
            echo "Supabase Auth did not become ready."
            exit 1
          fi

          key_file="$(mktemp "$RUNNER_TEMP/loya-oq002-keys.XXXXXX")"
          chmod 600 "$key_file"
          pnpm exec supabase status -o json | node --input-type=module -e '
            const chunks = [];
            for await (const chunk of process.stdin) chunks.push(chunk);
            const status = JSON.parse(Buffer.concat(chunks).toString("utf8"));
            const keys = [
              status.PUBLISHABLE_KEY,
              status.ANON_KEY,
              status.SERVICE_ROLE_KEY,
            ];
            if (!keys.every((value) => typeof value === "string" && value.length > 0)) {
              throw new Error("Required local Supabase keys are absent.");
            }
            process.stdout.write(`${keys[0]}\n${keys[1]}\n${keys[2]}\n`);
          ' > "$key_file"
          mapfile -t local_keys < "$key_file"
          if [[ "${#local_keys[@]}" -ne 3 ]]; then
            echo "Unexpected local Supabase key output."
            exit 1
          fi
          publishable_key="${local_keys[0]}"
          anon_key="${local_keys[1]}"
          service_role_key="${local_keys[2]}"
          echo "::add-mask::$publishable_key"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"

          OQ002_SUPABASE_URL=http://127.0.0.1:54321 \
            OQ002_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            pnpm setup:oq002:auth

          docker exec -i supabase_db_loya \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < apps/worker/poc/oq-002/setup.sql

          pgtap_log="$(mktemp "$RUNNER_TEMP/loya-oq002-pgtap.XXXXXX.log")"
          chmod 600 "$pgtap_log"
          if pnpm exec supabase test db \
            apps/worker/poc/oq-002/verify.sql \
            --local > "$pgtap_log" 2>&1; then
            verify_status=0
          else
            verify_status=$?
          fi
          verify_output="$(node scripts/redact-supabase-log.mjs "$pgtap_log")"
          printf '%s\n' "$verify_output"
          if [[ "$verify_status" -ne 0 ]] \
            || ! grep -q 'Files=1, Tests=9,' <<< "$verify_output" \
            || ! grep -q '^Result: PASS$' <<< "$verify_output"; then
            echo "OQ-002 SQL assertions failed."
            exit 1
          fi

          worker_env="$(mktemp "$RUNNER_TEMP/loya-oq002-worker.XXXXXX.env")"
          chmod 600 "$worker_env"
          printf 'SUPABASE_PUBLISHABLE_KEY="%s"\n' "$publishable_key" > "$worker_env"
          setsid pnpm exec wrangler dev \
            --config apps/worker/poc/oq-002/wrangler.jsonc \
            --ip 127.0.0.1 \
            --port 8788 \
            --env-file "$worker_env" \
            --show-interactive-dev-session=false \
            --log-level warn \
            > "$RUNNER_TEMP/oq002-worker.log" 2>&1 &
          worker_pid=$!

          OQ002_WORKER_URL=http://127.0.0.1:8788 \
            OQ002_SUPABASE_URL=http://127.0.0.1:54321 \
            OQ002_SUPABASE_PUBLISHABLE_KEY="$publishable_key" \
            OQ002_SUPABASE_ANON_KEY="$anon_key" \
            OQ002_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            pnpm test:oq002

      - name: Show Supabase database diagnostics
        if: failure() && steps.supabase_db.outcome == 'failure'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/supabase-start.log" ]]; then
            node scripts/redact-supabase-log.mjs "$RUNNER_TEMP/supabase-start.log"
          fi
          if [[ -f "$RUNNER_TEMP/oq002-worker.log" ]]; then
            node scripts/redact-supabase-log.mjs "$RUNNER_TEMP/oq002-worker.log"
          fi
          docker ps -a --filter 'name=supabase_' --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          for container in supabase_db_loya supabase_auth_loya supabase_rest_loya supabase_kong_loya; do
            diagnostic="$RUNNER_TEMP/${container}.log"
            if docker logs --tail 200 "$container" > "$diagnostic" 2>&1; then
              node scripts/redact-supabase-log.mjs "$diagnostic"
            fi
            rm -f -- "$diagnostic"
          done

      - name: Stop the Supabase database
        if: always() && steps.supabase_db.outcome != 'skipped'
        shell: bash
        run: |
          pnpm exec supabase stop --project-id loya --no-backup || true
          rm -f -- "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/oq002-worker.log"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser flows in Chromium
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke-test Static Assets and API routing
        shell: bash
        run: |
          pnpm --filter @loya/worker dev > "$RUNNER_TEMP/loya-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/loya-worker.log"
            exit 1
          fi

          node scripts/smoke-worker.mjs http://127.0.0.1:8787
